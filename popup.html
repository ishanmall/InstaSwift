<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #121214;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    p.sub {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #a1a1aa;
    }
    .status-line {
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 12px;
      padding: 8px;
      background: #1f1f23;
      border-radius: 6px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .card {
      background: #1f1f23;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
    }
    .card strong {
      display: block;
      font-size: 14px;
    }
    .card span {
      font-size: 9px;
      color: #a1a1aa;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      margin-bottom: 8px;
    }
    button.single-btn {
      background: linear-gradient(135deg, #2563eb, #9333ea);
    }
  </style>
</head>
<body>
  <h2>⚡ InstaSwift v38.0</h2>
  <p class="sub">Cloned GraphQL + Auto-Scroll + Observer Hook</p>
  <div class="status-line" id="p-status">Status: Idle</div>
  <div class="stats">
    <div class="card"><strong id="p-grid">0</strong><span>Room 1: Grid (G)</span></div>
    <div class="card"><strong id="p-reels">0</strong><span>Room 2: Reels (R\G)</span></div>
    <div class="card"><strong id="p-dups">0</strong><span>Room 3: Dups (G∩R)</span></div>
  </div>
  <div class="stats">
    <div class="card"><strong id="p-scanned">0</strong><span>Unique Queued</span></div>
    <div class="card"><strong id="p-downloaded">0</strong><span>Saved</span></div>
    <div class="card"><strong id="p-speed">0/s</strong><span>Velocity (v)</span></div>
  </div>
  <button id="p-single-trigger" class="single-btn">🎬 Download This Particular Video / Post</button>
  <button id="p-trigger">⚡ Download All (3-Room Full Profile)</button>
  <script src="popup.js"></script>
</body>
</html>

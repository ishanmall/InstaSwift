<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      background: #121214;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    p.sub {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #a1a1aa;
    }
    .status-line {
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 10px;
      padding: 8px;
      background: #1f1f23;
      border-radius: 6px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .card {
      background: #1f1f23;
      padding: 10px 6px;
      border-radius: 8px;
      text-align: center;
    }
    .card strong {
      display: block;
      font-size: 15px;
    }
    .card span {
      font-size: 10px;
      color: #a1a1aa;
    }
    .fmt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
    }
    select {
      background: #1f1f23;
      color: #fff;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
    }
  </style>
</head>
<body>
  <h2>⚡ InstaSwift v16.0</h2>
  <p class="sub">Tab-Independent Background Scanner + Zero-Dup Downloader</p>

  <div class="status-line" id="p-status">Status: Idle</div>

  <div class="stats">
    <div class="card"><strong id="p-posts">0</strong><span>1. Grid Posts</span></div>
    <div class="card"><strong id="p-reels">0</strong><span>2. Unique Reels</span></div>
  </div>

  <div class="fmt-row">
    <span>Photo Format:</span>
    <select id="p-fmt">
      <option value="auto">Auto (Original)</option>
      <option value="png">Force .PNG</option>
      <option value="jpg">Force .JPG</option>
    </select>
  </div>

  <button id="p-trigger">Download Current Profile</button>

  <script src="popup.js"></script>
</body>
</html>
